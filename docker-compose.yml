version: '3.8'
services:
  db:
    image: postgres:15
    container_name: loyalty-db
    environment:
      POSTGRES_DB: loyalty_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
