# Warstwa serwerowa LoyaltyClub: baza + backend.
#
# Siec "loyaltyclub-net" powstaje razem z tym plikiem i jest dolaczana przez
# repozytorium frontendu jako siec zewnetrzna. Dzieki temu oba wdrozenia
# zostaja niezalezne, a kontenery widza sie po nazwach uslug.
# Kolejnosc uruchamiania: najpierw ten plik, potem compose frontendu.
#
#   docker compose up -d --build        (albo scripts/stack.ps1 up)

name: loyaltyclub-backend

services:
  db:
    # Bez container_name - backend siega do bazy po nazwie uslugi ("db"),
    # ktora rozwiazuje DNS Dockera wewnatrz sieci. Stala nazwa kontenera
    # tylko kolidowalaby z innymi wdrozeniami tego projektu na tym hoscie.
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loyalty_db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      # Haslo bazy nie ma wartosci domyslnej - skladnia ":?" przerywa
      # podnoszenie uslugi z komunikatem, zamiast zalozyc klaster z haslem
      # znanym z repozytorium. Ta sama regula co dla JWT_SECRET i hasel kont
      # poczatkowych. Wartosc pochodzi z pliku .env (wzorzec: .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w pliku .env - openssl rand -base64 24}
    ports:
      # Publikowane na petli zwrotnej hosta, nie na wszystkich interfejsach:
      # port bazy sluzy wylacznie narzedziom deweloperskim uruchamianym na tej
      # samej maszynie. Bez prefiksu 127.0.0.1 Docker otwiera regule w zaporze
      # i baza jest osiagalna z sieci - zdalnie widoczny 5432/5433 to jeden
      # z najczesciej skanowanych portow. Backend laczy sie po sieci
      # kontenerow, jako db:5432, i tej publikacji nie potrzebuje: wdrozenie
      # produkcyjne cala sekcje "ports" usuwa.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-loyalty_db}"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - loyaltyclub

  backend:
    build:
      context: .
      target: runtime
      args:
        SKIP_TESTS: "true"
    image: ${BACKEND_IMAGE:-loyaltyclub/backend}:${IMAGE_TAG:-local}
    container_name: loyalty-backend
    restart: unless-stopped
    depends_on:
      db:
        # Liquibase startuje od razu przy podnoszeniu kontekstu, wiec baza
        # musi byc gotowa, a nie tylko uruchomiona.
        condition: service_healthy
    environment:
      # Nazwa hosta "db" pochodzi z nazwy uslugi - rozwiazuje ja DNS Dockera.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-loyalty_db}
      DB_USERNAME: ${POSTGRES_USER:-user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w pliku .env - openssl rand -base64 24}
      # Klucz podpisu JWT nie ma wartosci domyslnej - skladnia ":?" przerywa
      # podnoszenie uslugi z komunikatem, zamiast wystartowac z kluczem znanym
      # z repozytorium. Wartosc pochodzi z pliku .env (wzorzec: .env.example).
      JWT_SECRET: ${JWT_SECRET:?ustaw JWT_SECRET w pliku .env - openssl rand -base64 48}
      # Puste = frontend i API pod jednym originem (nginx frontendu przekazuje
      # /api dalej), wiec CORS nie jest potrzebny. Ustawiac tylko wtedy, gdy SPA
      # stoi pod innym adresem niz API.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseG1GC}
      # Zakladanie kont poczatkowych - domyslnie wylaczone. Hasla nie maja
      # wartosci domyslnych w kodzie: przy wlaczonym seedowaniu i pustym hasle
      # aplikacja nie wstanie. Wartosci pochodza z pliku .env, ktory nie jest
      # wersjonowany (wzorzec: .env.example).
      LOYALTYCLUB_SEED_ENABLED: ${LOYALTYCLUB_SEED_ENABLED:-false}
      LOYALTYCLUB_SEED_ADMIN_PASSWORD: ${LOYALTYCLUB_SEED_ADMIN_PASSWORD:-}
      LOYALTYCLUB_SEED_STORE_PASSWORD: ${LOYALTYCLUB_SEED_STORE_PASSWORD:-}
      LOYALTYCLUB_SEED_ECOM_PASSWORD: ${LOYALTYCLUB_SEED_ECOM_PASSWORD:-}
    ports:
      - "${BACKEND_HOST_PORT:-8089}:8089"
    networks:
      - loyaltyclub

volumes:
  postgres_data:

networks:
  loyaltyclub:
    # Stala nazwa (bez prefiksu projektu), zeby compose frontendu mogl
    # wskazac te sama siec jako zewnetrzna.
    name: loyaltyclub-net
