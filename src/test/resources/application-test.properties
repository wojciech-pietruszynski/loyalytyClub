# Profil dla testow warstwy persystencji (@DataJpaTest) i testow integracyjnych
# (@SpringBootTest). Nadpisuje wylacznie to, co wiaze aplikacje z PostgreSQL-em.
#
# Schemat buduje Hibernate z mapowan encji, a nie Liquibase: migracje w
# src/main/resources/db/migrations sa pisane w dialekcie PostgreSQL-a i nie
# wykonaja sie na H2. Testem, ze zestaw migracji przechodzi od zera, pozostaje
# krok "Weryfikacja migracji Liquibase" w potoku CI, ktory uruchamia je na
# prawdziwym PostgreSQL-u.
# NON_KEYWORDS=VALUE: kolumna coupon_prefixes.value nazywa sie tak samo jak
# slowo zastrzezone w trybie zgodnosci z PostgreSQL-em. W samym PostgreSQL-e
# "value" jest dozwolona jako nazwa kolumny (migracja 002), wiec zdejmujemy
# zastrzezenie w H2 zamiast zmieniac schemat produkcyjny pod test.
# Nazwa bazy z ${random.uuid}: kazdy kontekst Springa dostaje wlasna baze.
# Przy nazwie stalej wszystkie konteksty w jednej maszynie wirtualnej dzielily
# jedna baze w pamieci, a DB_CLOSE_DELAY=-1 utrzymywal ja przy zyciu takze po
# zamknieciu kontekstu. Zamkniecie kontekstu @DataJpaTest wykonywalo wtedy faze
# "drop" z ddl-auto=create-drop na bazie wspolnej i zabieralo schemat kontekstom
# uruchamianym pozniej -- CouponPrefixSeeder trafial na pusta baze i przerywal
# wstawanie kontekstu. Klasy przechodzily uruchamiane osobno, a caly zestaw byl
# czerwony: wynik zalezal od kolejnosci klas, a nie od kodu testu.
spring.datasource.url=jdbc:h2:mem:loyaltyclub_${random.uuid};MODE=PostgreSQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=false

# Zadania cykliczne wyzwalane sa w testach bezposrednim wywolaniem metody;
# harmonogram w tle zaklocalby wynik.
spring.task.scheduling.pool.size=1
app.maintenance.coupon-expiry-cron=-
app.maintenance.point-expiry-notice-cron=-
app.maintenance.token-cleanup-cron=-
app.maintenance.idempotency-cleanup-cron=-

# Wariant z frontendem pod osobnym adresem: bez zarejestrowanego originu
# zapytanie wstepne CORS jest odrzucane jeszcze przed regulami dostepu,
# wiec test macierzy uprawnien nie mialby czego sprawdzic.
app.cors.allowed-origins=https://panel.example.com

# @DataJpaTest domyslnie wlacza logowanie SQL; przy pelnym przebiegu zaglusza
# wyniki testow.
spring.jpa.show-sql=false
