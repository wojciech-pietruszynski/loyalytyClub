spring.application.name=loyalty-club
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/loyalty_db}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.liquibase.change-log=classpath:db/changelog-master.xml
spring.liquibase.drop-first=false

server.port=8089

# --- Zakladanie kont poczatkowych na pustej bazie ---------------------------
# Seedery kont (AdminUserSeeder, StoreUserSeeder, EcomUserSeeder) sa DOMYSLNIE
# WYLACZONE. Wlacza je wylacznie jawne ustawienie tej wlasciwosci na "true" -
# w srodowisku deweloperskim i w testach. Wdrozenie produkcyjne jej nie ustawia,
# wiec konta zakladane sa swiadoma czynnoscia operatora, a nie przy okazji
# pierwszego startu aplikacji.
loyaltyclub.seed.enabled=${LOYALTYCLUB_SEED_ENABLED:false}

# Hasla kont poczatkowych. CELOWO BEZ WARTOSCI DOMYSLNYCH: przy wlaczonym
# seedowaniu i nieustawionej zmiennej srodowiskowej rozwiazanie placeholdera
# konczy sie bledem i aplikacja nie wstaje. Awaria przy starcie jest tansza niz
# srodowisko dzialajace z haslem, ktorego nikt swiadomie nie wybral.
# Placeholdery rozwiazuja sie leniwie - przy wylaczonym seedowaniu ziarna
# seederow w ogole nie powstaja, wiec brak tych zmiennych niczego nie przerywa.
loyaltyclub.seed.admin.password=${LOYALTYCLUB_SEED_ADMIN_PASSWORD}
loyaltyclub.seed.store.password=${LOYALTYCLUB_SEED_STORE_PASSWORD}
loyaltyclub.seed.ecom.password=${LOYALTYCLUB_SEED_ECOM_PASSWORD}

security.jwt.secret=${JWT_SECRET:YWRtaW5Mb3lhbHR5Q2x1YlNlY3JldEtleUFkbWluTG95YWx0eUNsdWJTZWNyZXRLZXk=}
security.jwt.expiration-ms=900000
app.available-country-codes=PL,DE,CZ,SK,LT
# Originy frontendu (osobne repo/wdrozenie) dopuszczone do CORS, po przecinku.
# Puste = CORS wylaczony (SPA i API za jednym reverse proxy).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.store.default-points-per-currency=1.00
# springdoc od 2.7 generuje domyslnie OpenAPI 3.1. Kontrakt jest zrodlem
# generowanych bibliotek klienckich (m.in. C#), a nie kazdy generator czyta 3.1,
# wiec wersja specyfikacji zostaje ta sama, co przed migracja. Usuniecie tej
# linii przelacza wyjscie na 3.1.
springdoc.api-docs.version=openapi_3_0
spring.threads.virtual.enabled=true

# Actuator wystawia wylacznie sonde zdrowia - reszta endpointow zostaje
# wylaczona, bo obraz kontenera potrzebuje tylko sygnalu gotowosci.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
