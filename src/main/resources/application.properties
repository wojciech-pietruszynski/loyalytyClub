spring.application.name=loyalty-club
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/loyalty_db}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.liquibase.change-log=classpath:db/changelog-master.xml
spring.liquibase.drop-first=false

server.port=8089

security.jwt.secret=${JWT_SECRET:YWRtaW5Mb3lhbHR5Q2x1YlNlY3JldEtleUFkbWluTG95YWx0eUNsdWJTZWNyZXRLZXk=}
security.jwt.expiration-ms=900000
app.available-country-codes=PL,DE,CZ,SK,LT
# Originy frontendu (osobne repo/wdrozenie) dopuszczone do CORS, po przecinku.
# Puste = CORS wylaczony (SPA i API za jednym reverse proxy).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.store.default-points-per-currency=1.00
# springdoc od 2.7 generuje domyslnie OpenAPI 3.1. Kontrakt jest zrodlem
# generowanych bibliotek klienckich (m.in. C#), a nie kazdy generator czyta 3.1,
# wiec wersja specyfikacji zostaje ta sama, co przed migracja. Usuniecie tej
# linii przelacza wyjscie na 3.1.
springdoc.api-docs.version=openapi_3_0
spring.threads.virtual.enabled=true

# Actuator wystawia wylacznie sonde zdrowia - reszta endpointow zostaje
# wylaczona, bo obraz kontenera potrzebuje tylko sygnalu gotowosci.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
